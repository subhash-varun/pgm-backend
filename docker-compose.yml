version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: pgm-postgres
    environment:
      POSTGRES_DB: pgm_db
      POSTGRES_USER: pgm_user
      POSTGRES_PASSWORD: pgm_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pgm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgm_user -d pgm_db"]
      timeout: 20s
      retries: 10

  pgm-app:
    build: .
    container_name: pgm-app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pgm_db
      SPRING_DATASOURCE_USERNAME: pgm_user
      SPRING_DATASOURCE_PASSWORD: pgm_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
    networks:
      - pgm-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  pgm-network:
    driver: bridge
