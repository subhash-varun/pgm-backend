version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pgm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: pgm_db
      MYSQL_USER: pgm_user
      MYSQL_PASSWORD: pgm_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pgm-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  pgm-app:
    build: .
    container_name: pgm-app
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pgm_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password123
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
    networks:
      - pgm-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  pgm-network:
    driver: bridge
